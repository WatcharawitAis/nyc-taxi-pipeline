- check:
    arguments:
      column: tpep_pickup_datetime
    function: is_not_null
  criticality: error
  name: tpep_pickup_datetime_is_null

- check:
    arguments:
      column: tpep_dropoff_datetime
    function: is_not_null
  criticality: error
  name: tpep_dropoff_datetime_is_null

- check:
    arguments:
      column: PULocationID
    function: is_not_null
  criticality: error
  name: pulocationid_is_null

- check:
    arguments:
      column: DOLocationID
    function: is_not_null
  criticality: error
  name: dolocationid_is_null

- check:
    arguments:
      column: trip_distance
    function: is_not_null
  criticality: error
  name: trip_distance_is_null

- check:
    arguments:
      column: fare_amount
    function: is_not_null
  criticality: error
  name: fare_amount_is_null

- check:
    function: sql_expression
    arguments:
      expression: fare_amount > 0
      msg: "fare_amount must be greater than 0"
      columns:
        - fare_amount
  criticality: error
  name: fare_amount_is_positive

- check:
    function: sql_expression
    arguments:
      expression: trip_distance > 0
      msg: "trip_distance must be greater than 0"
      columns:
        - trip_distance
  criticality: error
  name: trip_distance_is_positive

- check:
    arguments:
      column: trip_duration_minutes
    function: is_not_null
  criticality: error
  name: trip_duration_minutes_is_null

- check:
    function: sql_expression
    arguments:
      expression: trip_duration_minutes > 0
      msg: "trip_duration_minutes must be greater than 0"
      columns:
        - trip_duration_minutes
  criticality: error
  name: trip_duration_minutes_is_positive

- check:
    function: sql_expression
    arguments:
      expression: tpep_dropoff_datetime > tpep_pickup_datetime
      msg: "tpep_dropoff_datetime must be after tpep_pickup_datetime"
      columns:
        - tpep_pickup_datetime
        - tpep_dropoff_datetime
  criticality: error
  name: dropoff_after_pickup

- check:
    arguments:
      column: avg_speed_mph
    function: is_not_null
  criticality: error
  name: avg_speed_mph_is_null

- check:
    arguments:
      column: pickup_hour
    function: is_not_null
  criticality: error
  name: pickup_hour_is_null

- check:
    arguments:
      column: pickup_hour
      max_limit: 23
      min_limit: 0
    function: is_in_range
  criticality: error
  name: pickup_hour_isnt_in_range

- check:
    arguments:
      column: pickup_day_of_week
    function: is_not_null
  criticality: error
  name: pickup_day_of_week_is_null

- check:
    arguments:
      allowed:
      - 5
      - 2
      - 6
      - 7
      - 4
      - 1
      - 3
      column: pickup_day_of_week
    function: is_in_list
  criticality: error
  name: pickup_day_of_week_other_value
