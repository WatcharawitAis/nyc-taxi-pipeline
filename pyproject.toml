[project]
name = "nyc-taxi-pipeline"
version = "1.0.0"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"] 

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".github",
    "explorations",
    "resources",
]
[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.pytest.ini_options]
# Test discovery patterns
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test paths
testpaths = ["tests/"]

# Output options
addopts = "-v --tb=short --strict-markers --color=yes -ra"

# Markers
markers = [
    "unit: Unit tests - test individual functions in isolation (fast, no external dependencies)",
    "bronze: Tests related to bronze layer",
    "silver: Tests related to silver layer",
    "gold: Tests related to gold layer",
    "data_quality: Tests that verify data quality rules",
]

# Log configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Warning filters
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]