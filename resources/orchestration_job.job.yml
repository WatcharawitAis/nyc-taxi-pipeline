resources:
  jobs:
    orchestration_job:
      name: ETL-Orchestration-Pipeline - ${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: task_env
          spec:
            environment_version: "5"
            dependencies:
              - dbutils
              - ../dist/*.whl

      email_notifications:
        on_failure: ${var.alert_email}

      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: false

      tasks:
        - task_key: yellow_taxi_ingest_task
          environment_key: task_env
          spark_python_task:
            python_file: ../src/ingest/yellow_taxi_data_download.py

        - task_key: yellow_taxi_bronze_to_silver
          depends_on:
            - task_key: yellow_taxi_ingest_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.yellow_taxi_pipeline.id}

        - task_key: gold_task
          depends_on:
            - task_key: yellow_taxi_bronze_to_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.nyc_taxi_gold_pipeline.id}
