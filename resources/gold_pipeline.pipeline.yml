resources:
  pipelines:
    nyc_taxi_pipeline:
      name: NYC Taxi Data Pipeline - ${bundle.target}

      # Unity Catalog configuration
      catalog: ${var.catalog}
      target: ${var.bronze_schema}

      # Configuration parameters accessible in pipeline code via spark.conf
      configuration:
        gold_schema: ${var.gold_schema}
        catalog: ${var.catalog}

      libraries:
        - file:
            path: ../src/pipeline/shared/gold_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl
          - databricks-labs-dqx==0.8.0

      # Compute configuration
      serverless: true

      # Pipeline mode
      continuous: false
      development: ${var.pipeline_development}
