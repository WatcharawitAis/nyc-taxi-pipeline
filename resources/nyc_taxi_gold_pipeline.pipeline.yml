resources:
  pipelines:
    nyc_taxi_gold_pipeline:
      name: NYC Taxi Gold Pipeline - ${bundle.target}

      # Unity Catalog configuration
      catalog: ${var.catalog}
      schema: ${var.gold_schema}

      configuration:
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}
        catalog: ${var.catalog}

      libraries:
        - file:
            path: ../src/pipeline/gold/nyc_taxi_gold_layer.py

      environment:
        dependencies:
          - ../dist/*.whl

      serverless: true
      photon: true
      continuous: false
      development: ${var.pipeline_development}

      notifications:
        - alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure
          email_recipients: ${var.alert_email}
