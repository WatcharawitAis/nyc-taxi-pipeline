resources:
  pipelines:
    yellow_taxi_pipeline:
      name: NYC Yellow Taxi Pipeline - ${bundle.target}

      # Unity Catalog configuration
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}

      configuration:
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        catalog: ${var.catalog}
        landing_schema: ${var.landing_schema}
        landing_volume: ${var.landing_volume}

      libraries:
        - file:
            path: ../src/pipeline/yellow_taxi/yellow_taxi_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl
          - databricks-labs-dqx==0.8.0

      serverless: true
      photon: true
      continuous: false
      development: ${var.pipeline_development}

