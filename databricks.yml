bundle:
  name: nyc-taxi

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variables for resource files
variables:
  catalog:
    description: Unity Catalog name
    default: main
  bronze_schema:
    description: Bronze layer schema
    default: bronze
  silver_schema:
    description: Silver layer schema
    default: silver
  gold_schema:
    description: Gold layer schema
    default: gold
  landing_schema:
    description: Unity Catalog schema containing the real NYC TLC landing volume
    default: landing
  landing_volume:
    description: Unity Catalog Volume name where real NYC TLC monthly files land
    default: nyc-yellow-taxi-files
  warehouse_id:
    description: SQL Warehouse ID for jobs and the data-quality monitoring alert
    default: ""
  pipeline_development:
    description: Enable development mode for pipeline
    default: true
  alert_email:
    description: Email recipients for job/pipeline failure alerts. Must be
      non-empty - the pipeline/job notification APIs reject an `alerts` list
      paired with zero recipients.
    type: complex
    default:
      - watchaaq@ais.co.th
  alert_email_primary:
    description: Single email address subscribed to the data-quality SQL alert (Alerts V2 subscriptions take one recipient object per entry, not a plain list)
    default: watchaaq@ais.co.th
  schedule_pause_status:
    description: Whether the monthly orchestration_job schedule is active
    default: "PAUSED"
  quality_gate_threshold_pct:
    description: Max acceptable DQX quarantine rate (%) on silver_yellow_tripdata
      before quality_gate_task fails the job and blocks gold_pipeline from running
    default: "20"

# Include resource files
include:
  - resources/*.yml
# Development target (default)
targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: biap_dev
      pipeline_development: true
      warehouse_id: 8261d83d59907973
  
  # Staging target
  staging:
    mode: production
    workspace:
      root_path: /Workspace/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: biap_staging
      pipeline_development: false
  
  # Production target
  prod:
    mode: production
    workspace:
      root_path: /Workspace/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: biap_prod
      pipeline_development: false
      alert_email:
        - watchaaq@ais.co.th
      alert_email_primary: watchaaq@ais.co.th
      schedule_pause_status: "UNPAUSED"
    permissions:
      - user_name: watchaaq@ais.co.th
        level: CAN_MANAGE
